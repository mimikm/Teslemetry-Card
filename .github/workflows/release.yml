name: Release

# When a release is published, attach the card file to it. HACS then
# installs from the release, and GitHub counts each download.
# It can also be run by hand (Actions -> Release -> Run workflow) to attach
# the file to a release that's already published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the card file to (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  attach-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the card version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          V="${TAG#v}"
          grep -q "const CARD_VERSION = '$V';" teslemetry-card.js || { echo "CARD_VERSION in teslemetry-card.js does not match tag $TAG"; exit 1; }

      - name: Attach teslemetry-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" teslemetry-card.js --clobber
